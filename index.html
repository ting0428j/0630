<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body {
            font-family: 'Kiwi Maru', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #faf5ff 50%, #f0fdf4 100%);
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
            touch-action: manipulation;
            overflow-x: hidden;
        }
        
        .bg-stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 235, 240, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(240, 235, 255, 0.5) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .star-sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(255,255,255,0.8);
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.2);
            border-radius: 24px;
        }

        .btn-magic {
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #d13076;
            border: none;
            border-bottom: 4px solid #ff758c;
            transition: all 0.15s ease;
        }
        .btn-magic:active {
            transform: translateY(4px);
            border-bottom: 0px solid #ff758c;
            margin-top: 4px;
        }

        .target-slot {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 4.5rem;
            height: 5.5rem;
            background: #f1f5f9;
            border: 3px dashed #94a3b8;
            border-radius: 12px;
            margin: 0 0.5rem;
            vertical-align: middle;
            color: transparent;
            position: relative;
        }
        .target-slot.filled {
            background: #ffedd5;
            border: 3px solid #fdba74;
            color: #c2410c;
            font-weight: bold;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .character-text {
            font-size: 2.2rem;
            line-height: 1.4;
            color: #2d3748;
        }
        .ruby-text {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 2px;
        }
        .ruby-char { font-size: 2.2rem; }
        .ruby-pinyin { font-size: 0.9rem; color: #718096; }

        .puzzle-container {
            border: 6px solid #fbc2eb;
            box-shadow: 0 10px 25px rgba(251, 194, 235, 0.5);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

    <div class="bg-stars" id="star-container"></div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="lesson-grid">
                <!-- 課程按鈕由 JS 產生 -->
            </div>
            
            <button onclick="loadLesson('all')" class="w-full btn-magic py-4 rounded-2xl text-2xl font-bold shadow-lg flex justify-center items-center">
                <i class="fa-solid fa-crown mr-3 text-yellow-400"></i>
                皇家綜合大挑戰

            </button>
        </div>
    </div>

                <i class="fa-solid fa-star text-yellow-400 mr-2"></i> <span id="score-display">0</span> / 10
            </div>
        </div>

        <div class="flex flex-col md:flex-row w-full gap-6 items-start justify-center">
            <!-- 左側：公主拼圖區域 -->
            <div class="w-full md:w-1/3 flex justify-center flex-shrink-0">
                <div class="puzzle-container relative w-64 h-64 md:w-80 md:h-80 bg-white rounded-2xl overflow-hidden">

                    <!-- 拼圖遮罩格線 -->
                    <div id="puzzle-grid" class="absolute inset-0 grid grid-cols-5 grid-rows-2 gap-0">
                        <!-- 由 JS 產生 10 個遮罩 -->
                    </div>
                </div>
            </div>

            <!-- 右側：題目與打字區 -->
            <div class="w-full md:w-2/3 flex flex-col items-center gap-6">
                <!-- 題目區塊 -->
                <div class="glass-panel w-full p-6 text-center shadow-md">
                    <p class="text-gray-500 mb-4 text-lg font-bold">請輸入紅字的正確注音</p>
                    <div id="sentence-container" class="character-text flex flex-wrap justify-center items-end gap-y-6">
                        <!-- 句子內容由 JS 產生 -->
                    </div>
                </div>

                <!-- 輸入顯示與功能鍵 -->
                <div class="flex items-center gap-2 md:gap-4 w-full justify-center">
                    <div id="pinyin-input" class="text-2xl md:text-3xl font-bold tracking-[0.2em] text-pink-600 bg-white border-2 border-pink-300 border-b-4 h-12 md:h-14 min-w-[120px] md:min-w-[150px] flex items-center justify-center rounded-xl px-4 shadow-inner transition-colors duration-300">
                        <!-- 使用者輸入的注音會顯示在這裡 -->
                    </div>
                    <button onclick="handleVirtualKey('delete')" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 md:px-5 h-12 md:h-14 rounded-xl border-b-4 border-gray-600 active:border-b-0 active:translate-y-1 transition text-xl">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                    <button onclick="handleVirtualKey('submit')" class="bg-green-400 hover:bg-green-500 text-white font-bold py-2 px-4 md:px-6 h-12 md:h-14 rounded-xl border-b-4 border-green-600 active:border-b-0 active:translate-y-1 transition text-lg md:text-xl">
                        確認 (Enter)
                    </button>
                </div>

                <!-- 虛擬注音鍵盤 (實體鍵盤亦可直接連動) -->
                <div class="w-full max-w-lg bg-white/80 p-4 rounded-2xl shadow-lg border-2 border-pink-100 mt-2">
                    <div id="virtual-keyboard" class="flex flex-wrap justify-center gap-1 md:gap-2">
                        <!-- 鍵盤按鈕由 JS 產生 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 過關彈跳視窗 -->

                        回主選單

                </div>
            </div>
        </div>
    </div>

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function loadLesson(id) {
            state.currentLessonId = id;
            state.score = 0;
            state.currentQuestionIndex = 0;
            state.isLocked = false;
            document.getElementById('score-display').innerText = state.score;
            
            initPuzzle(); // 重置拼圖

            let pool = [];
            if (id === 'all') {
                document.getElementById('game-title').innerText = "皇家綜合大挑戰";
                pool = lessonData.flatMap(lesson => lesson.words);
            } else {
                const lesson = lessonData.find(l => l.id === id);
                document.getElementById('game-title').innerText = lesson.title;
                pool = [...lesson.words];
            }

            shuffle(pool);
            state.questions = pool.slice(0, state.maxScore);
            
            while(state.questions.length < state.maxScore) {
                 let extraPool = [...pool];
                 shuffle(extraPool);
                 state.questions.push(extraPool[0]);
            }

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            showQuestion();
        }

            const q = state.questions[state.currentQuestionIndex];
            const sentenceDiv = document.getElementById('sentence-container');
            sentenceDiv.innerHTML = '';
            
            let found = false;
            for (let i = 0; i < q.sentence.length; i++) {
                const char = q.sentence[i];
                if (char === q.char && !found) {
                    const slot = document.createElement('div');
                    slot.className = 'target-slot';
                    slot.id = 'drop-target';
                    // 顯示中文字，將注音部分隱藏等待輸入
                    slot.innerHTML = `<span class="ruby-char text-pink-600">${char}</span><span class="ruby-pinyin text-transparent">_</span>`;
                    sentenceDiv.appendChild(slot);
                    found = true;
                } else {
                    const span = document.createElement('span');
                    span.className = 'ruby-text';
                    span.innerHTML = `<span class="ruby-char">${char}</span>`;
                    sentenceDiv.appendChild(span);
                }
            }
            
            speak(q.sentence);
        }

        // 處理虛擬/實體按鍵輸入
        function handleVirtualKey(key) {
            if (state.isLocked) return;

            if (key === 'delete') {
                state.currentInput = state.currentInput.slice(0, -1);
            } else if (key === 'submit') {
                checkAnswer();
                return;
            } else {
                if (state.currentInput.length < 4) { // 注音符號最多 3 個加上聲調 1 個
                    state.currentInput += key;
                }
            }
            updateInputDisplay();
        }

        function updateInputDisplay() {
            document.getElementById('pinyin-input').innerText = state.currentInput;
        }

        // 檢查答案是否正確
        function checkAnswer() {
            if (!state.currentInput) return; // 空白不送出

            const q = state.questions[state.currentQuestionIndex];
            const correctPinyin = q.pinyin;
            const inputEl = document.getElementById('pinyin-input');

            if (state.currentInput === correctPinyin) {
                // 答對了
                state.isLocked = true;
                inputEl.classList.add('bg-green-100', 'text-green-700', 'border-green-400');
                
                // 解鎖一塊拼圖
                const piece = document.getElementById(`piece-${state.score}`);
                if (piece) piece.style.opacity = '0';

                state.score++;
                document.getElementById('score-display').innerText = state.score;
                speak(q.char); // 唸出該字

                // 填入題目空格
                const targetSlot = document.getElementById('drop-target');
                targetSlot.classList.add('filled');
                targetSlot.innerHTML = `<span class="ruby-char text-gray-800">${q.char}</span><span class="ruby-pinyin !text-orange-600">${correctPinyin}</span>`;

                setTimeout(() => {
                    state.currentQuestionIndex++;
                    if (state.currentQuestionIndex < state.maxScore) {
                        showQuestion();
                    } else {
                        showCompletion();
                    }
                }, 1200);

            } else {
                // 答錯了
                inputEl.classList.add('bg-red-100', 'text-red-600', 'border-red-400', 'animate-[shake_0.4s_ease-in-out]');
                setTimeout(() => {
                    inputEl.classList.remove('bg-red-100', 'text-red-600', 'border-red-400', 'animate-[shake_0.4s_ease-in-out]');
                    state.currentInput = "";
                    updateInputDisplay();
                }, 500);
            }
        }

        // 實體鍵盤事件監聽
        document.addEventListener('keydown', (e) => {
            if (state.isLocked) return;
            if (document.getElementById('game-screen').classList.contains('hidden')) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return; // 忽略組合鍵

            const key = e.key.toLowerCase();
            
            if (key === 'backspace') {
                handleVirtualKey('delete');
                e.preventDefault(); 
                return;
            }
            if (key === 'enter' || key === ' ') { // 允許 Enter 或空白鍵當作確認
                handleVirtualKey('submit');
                e.preventDefault(); 
                return;
            }

            const bopo = physicalKeyMap[key];
            if (bopo) {
                handleVirtualKey(bopo);
                e.preventDefault();
            }
        });

        function showCompletion() {
            const modal = document.getElementById('completion-modal');
            const btnNext = document.getElementById('btn-next-lesson');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            speak("太棒了！拼圖解鎖完成！");

            if (state.currentLessonId !== 'all' && state.currentLessonId < 12) {
                btnNext.classList.remove('hidden');
                document.getElementById('feedback-text').innerText = "太棒了！成功獲得星光公主的美麗畫作！";
            } else {
                btnNext.classList.add('hidden');
                document.getElementById('feedback-text').innerText = "恭喜！12 幅皇家畫作全數解鎖！";
            }
        }

        function backToMenu() {
            window.speechSynthesis.cancel();
            document.getElementById('completion-modal').classList.add('hidden');
            document.getElementById('completion-modal').classList.remove('flex');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function replayLesson() {
            window.speechSynthesis.cancel();
            document.getElementById('completion-modal').classList.add('hidden');
            document.getElementById('completion-modal').classList.remove('flex');
            loadLesson(state.currentLessonId);
        }

        function goToNextLesson() {
            window.speechSynthesis.cancel();
            document.getElementById('completion-modal').classList.add('hidden');
            document.getElementById('completion-modal').classList.remove('flex');
            if (state.currentLessonId !== 'all' && state.currentLessonId < 12) {
                loadLesson(state.currentLessonId + 1);
            }
        }

        window.onload = () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
                window.speechSynthesis.getVoices(); 
            }
            initMenu();
        };
    </script>
</body>
</html>
